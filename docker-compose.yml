services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat_system
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./shared/src/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api-service/Dockerfile
    environment:
      API_PORT: 3000
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat_system
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      CHAT_PORT: 4000
      CHAT_PUBLIC_HOST: localhost
      CHAT_SERVICE_ID: chat-docker-1
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat_system
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5155:80"
    depends_on:
      - api
      - chat

volumes:
  postgres-data:
  redis-data:
